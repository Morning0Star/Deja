# The services the test suite uses. Tests that need one skip when it isn't running.
#
#   docker compose up -d --wait     # start them all and wait until each is healthy
#   docker compose down             # stop and remove them
#
# Ports are bound to 127.0.0.1 only, on unusual numbers so they don't clash with local databases.
name: deja-test

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: deja
      POSTGRES_PASSWORD: deja
      POSTGRES_DB: deja
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "deja"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  mongo:
    image: mongo:7
    ports: ["127.0.0.1:27217:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      retries: 30

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: deja
      MYSQL_DATABASE: deja
    ports: ["127.0.0.1:53306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-pdeja", "--silent"]
      interval: 3s
      retries: 40

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:59092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports: ["127.0.0.1:59092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9092'"]  # the broker accepts connections
      interval: 3s
      retries: 40
