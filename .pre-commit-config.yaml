# pip install pre-commit && pre-commit install   (runs on every commit; `pre-commit run -a` checks everything)
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        files: ^(src|tests|docs/examples)/
      - id: ruff-format
        files: ^(src|tests|gallery|benchmarks|spikes|docs/examples)/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
        exclude: \.(deja|png)$
      - id: trailing-whitespace
        exclude: \.(deja|png)$
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
