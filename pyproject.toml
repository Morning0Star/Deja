[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "deja-replay"
version = "0.0.2"
description = "Record the real scheduling order of an asyncio app and replay its race conditions deterministically."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Kushagra Sagar" }]
dependencies = ["sqlglot>=25"]  # SQL parsing for the report: which rows each statement read and wrote
keywords = ["asyncio", "race condition", "record replay", "deterministic replay", "debugging", "fastapi", "asgi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Repository = "https://github.com/Morning0Star/Deja"
Documentation = "https://github.com/Morning0Star/Deja#readme"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "redis>=5", "sqlalchemy[asyncio]>=2"]
gallery = ["fastapi>=0.115", "httpx>=0.27", "uvicorn>=0.30", "asyncpg>=0.30"]
bench = ["psutil>=5.9"]
frameworks = ["litestar>=2", "quart>=0.19", "django>=5"]  # test_frameworks: the same race on other ASGI frameworks
sql = []  # kept so `pip install deja-replay[sql]` still works; sqlglot is a dependency now

[project.scripts]
deja = "deja.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deja"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
