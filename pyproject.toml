[build-system]
requires = ["hatchling>=1.27"]  # 1.27: SPDX license and license-files (PEP 639)
build-backend = "hatchling.build"

[project]
name = "deja-replay"
dynamic = ["version"]  # from src/deja/__init__.py
description = "Record the real scheduling order of an asyncio app and replay its race conditions deterministically."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Kushagra Sagar" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["sqlglot>=25"]  # SQL parsing for the report: which rows each statement read and wrote
keywords = ["asyncio", "race condition", "record replay", "deterministic replay", "debugging", "fastapi", "asgi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Testing",
    "Framework :: Django",
]

[project.urls]
Homepage = "https://github.com/Morning0Star/Deja"
Repository = "https://github.com/Morning0Star/Deja"
Documentation = "https://morning0star.github.io/Deja/"
Issues = "https://github.com/Morning0Star/Deja/issues"
Changelog = "https://github.com/Morning0Star/Deja/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "mypy>=1.13", "redis>=5", "sqlalchemy[asyncio]>=2"]
gallery = ["fastapi>=0.115", "httpx>=0.27", "uvicorn>=0.30", "asyncpg>=0.30"]
bench = ["psutil>=5.9"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.29"]  # mkdocs build --strict
frameworks = ["litestar>=2", "quart>=0.19", "django>=5", "aiohttp>=3.9"]
drivers = ["psycopg[binary]>=3.1", "psycopg_pool>=3.2", "aiosqlite>=0.20", "grpcio>=1.60", "aiobotocore>=2.13", "moto[server]>=5",
           "pymongo>=4.13", "aiomysql>=0.2", "aiokafka>=0.11", "requests>=2.31"]  # tests of the other adapters
sql = []  # kept so `pip install deja-replay[sql]` still works; sqlglot is a dependency now

[project.scripts]
deja = "deja.cli:main"

[tool.hatch.version]
path = "src/deja/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/deja"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "gallery", "docs", "mkdocs.yml", "compose.yaml", "README.md", "CHANGELOG.md", "CONTRIBUTING.md",
           "SECURITY.md", "LICENSE", "NOTICE", "pyproject.toml"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["deja"]
known-local-folder = ["wallet"]  # docs/examples import their app as a sibling module

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["deja"]
branch = true

[tool.coverage.report]
fail_under = 80  # measured 82% on CPython 3.14 with every service running
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "pragma: no cover"]

[tool.mypy]
python_version = "3.12"
files = ["src/deja"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
