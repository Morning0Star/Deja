name: publish

# Releases go out through PyPI's trusted publishing: no passwords or tokens are stored anywhere.
#
#   Try a build on TestPyPI:  Actions → publish → Run workflow (uploads to TestPyPI only)
#   Release:                  push a tag vX.Y.Z matching src/deja/__init__.py → TestPyPI, then PyPI
#                             (the pypi environment asks for approval before the upload)
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the sdist and wheel
        run: python -m pip install build twine && python -m build && twine check --strict dist/*
      - name: The tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/deja/__init__.py').read()).group(1))")
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "tag ${GITHUB_REF_NAME} but the package is ${version}"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/deja-replay/
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true  # running it again for the same version is fine on TestPyPI

  pypi:
    needs: testpypi
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/deja-replay/
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
