name: Tests

# Started by hand only (Actions → Tests → Run workflow): the full matrix uses a lot of the monthly minutes
# (macOS minutes count 10x, Windows 2x). Choose "linux" for one Linux job, or "full" for every OS and version.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: "linux (one job) or full (every OS and Python)"
        default: linux
        type: choice
        options: [linux, full]

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20  # a hung test must not eat the month's minutes
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.scope == 'full' && '["ubuntu-latest", "windows-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
        python: ${{ fromJSON(inputs.scope == 'full' && '["3.12", "3.13", "3.14", "3.15"]' || '["3.14"]') }}
    steps:
      - uses: actions/checkout@v4

      # The services the adapter tests use (compose.yaml; Linux runners only, elsewhere those tests skip).
      - name: Start test services
        if: runner.os == 'Linux'
        run: docker compose up -d --wait

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install -e ".[dev,gallery]"
          python -m pip install -e ".[frameworks]" || echo "frameworks extra not installable here: those tests skip"
          python -m pip install -e ".[drivers]" || echo "drivers extra not installable here: those tests skip"

      - name: Lint
        run: python -m pip install ruff mypy && ruff check src tests docs/examples && ruff format --check src tests gallery benchmarks spikes docs/examples && mypy

      - name: Tests
        # coverage on the Linux 3.14 job, where every service runs; it fails below the minimum in pyproject.toml
        run: python -m pytest -q ${{ (runner.os == 'Linux' && matrix.python == '3.14') && '--cov=deja' || '' }}

      - name: Replay acceptance (in-memory gallery)
        run: python -m gallery.acceptance --recordings 2 --replays 20

      - name: Replay acceptance (Postgres gallery)
        if: runner.os == 'Linux'
        env:
          DEJA_PG_DSN: postgresql://deja:deja@127.0.0.1:55432/deja
        run: python -m gallery.acceptance --recordings 2 --replays 20

  pypy:
    name: ubuntu-latest / PyPy 3.12
    if: inputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "pypy3.12"
      - name: Install
        # the drivers that run on PyPy; asyncpg, grpcio, moto and litestar don't, and their tests skip themselves
        run: >
          python -m pip install -e ".[dev]" fastapi httpx uvicorn aiosqlite aiomysql pymongo aiokafka
          aiohttp requests aiobotocore quart django
      - name: Tests
        run: python -m pytest -q
