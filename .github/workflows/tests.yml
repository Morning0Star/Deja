name: Tests

# Started by hand only (Actions → Tests → Run workflow): the full matrix uses a lot of the monthly minutes
# (macOS minutes count 10x, Windows 2x). Choose "linux" for one Linux job, or "full" for every OS and version.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: "linux (one job) or full (every OS and Python)"
        default: linux
        type: choice
        options: [linux, full]

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20  # a hung test must not eat the month's minutes
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.scope == 'full' && '["ubuntu-latest", "windows-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
        python: ${{ fromJSON(inputs.scope == 'full' && '["3.12", "3.13", "3.14", "3.15"]' || '["3.14"]') }}
    steps:
      - uses: actions/checkout@v4

      # Postgres and Redis for the adapter tests (Linux runners only; on Windows/macOS those tests skip).
      - name: Start Postgres and Redis
        if: runner.os == 'Linux'
        run: |
          docker run -d --name deja-pg -e POSTGRES_USER=deja -e POSTGRES_PASSWORD=deja -e POSTGRES_DB=deja \
            -p 127.0.0.1:55432:5432 postgres:17-alpine
          docker run -d --name deja-redis -p 127.0.0.1:56379:6379 redis:7-alpine
          docker run -d --name deja-mongo -p 127.0.0.1:27217:27017 mongo:7
          docker run -d --name deja-mysql -p 127.0.0.1:53306:3306 -e MYSQL_ROOT_PASSWORD=deja -e MYSQL_DATABASE=deja mysql:8.4
          docker run -d --name deja-kafka -p 127.0.0.1:59092:9092 -e KAFKA_NODE_ID=1             -e KAFKA_PROCESS_ROLES=broker,controller -e KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093             -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:59092 -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER             -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT             -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1             -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1             -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 apache/kafka:3.9.0
          for i in $(seq 1 60); do docker exec deja-mysql mysqladmin -uroot -pdeja ping >/dev/null 2>&1 && break; sleep 1; done
          for i in $(seq 1 30); do docker exec deja-pg pg_isready -U deja && break; sleep 1; done

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install -e ".[dev,gallery]"
          python -m pip install -e ".[frameworks]" || echo "frameworks extra not installable here: those tests skip"
          python -m pip install -e ".[drivers]" || echo "drivers extra not installable here: those tests skip"

      - name: Lint
        run: python -m pip install ruff && ruff check src tests docs/examples && ruff format --check src tests gallery benchmarks spikes docs/examples

      - name: Tests
        run: python -m pytest -q

      - name: Replay acceptance (in-memory gallery)
        run: python -m gallery.acceptance --recordings 2 --replays 20

      - name: Replay acceptance (Postgres gallery)
        if: runner.os == 'Linux'
        env:
          DEJA_PG_DSN: postgresql://deja:deja@127.0.0.1:55432/deja
        run: python -m gallery.acceptance --recordings 2 --replays 20

  pypy:
    name: ubuntu-latest / PyPy 3.12
    if: inputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "pypy3.12"
      - name: Install
        run: python -m pip install -e ".[dev]" fastapi httpx uvicorn
      - name: Tests (no database adapters)
        run: >
          python -m pytest -q --ignore=tests/test_sql_live.py --ignore=tests/test_sqlalchemy.py
          --ignore=tests/test_streams.py --ignore=tests/test_adapters.py --ignore=tests/test_pubsub.py
          --ignore=tests/test_gallery.py
