name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4

      # Postgres and Redis for the adapter tests (Linux runners only; on Windows/macOS those tests skip).
      - name: Start Postgres and Redis
        if: runner.os == 'Linux'
        run: |
          docker run -d --name deja-pg -e POSTGRES_USER=deja -e POSTGRES_PASSWORD=deja -e POSTGRES_DB=deja \
            -p 127.0.0.1:55432:5432 postgres:17-alpine
          docker run -d --name deja-redis -p 127.0.0.1:56379:6379 redis:7-alpine
          for i in $(seq 1 30); do docker exec deja-pg pg_isready -U deja && break; sleep 1; done

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e ".[dev,gallery]"

      - name: Tests
        run: python -m pytest -q

      - name: Replay acceptance (in-memory gallery)
        run: python -m gallery.acceptance --recordings 2 --replays 20

      - name: Replay acceptance (Postgres gallery)
        if: runner.os == 'Linux'
        env:
          DEJA_PG_DSN: postgresql://deja:deja@127.0.0.1:55432/deja
        run: python -m gallery.acceptance --recordings 2 --replays 20
